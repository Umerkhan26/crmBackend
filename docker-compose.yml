version: "3.8"

services:
  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  app:
    build: .
    container_name: crm-backend
    ports:
      - "3000:3000"
    depends_on:
      - redis
    volumes:
      - .:/app
    command: npm start
    env_file:
      - .env
