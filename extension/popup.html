<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Voice CRM</title>
    <style>
      body {
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif;
        margin: 12px;
        width: 320px;
      }
      label { display: block; margin-top: 10px; font-size: 12px; color: #333; }
      input, textarea {
        width: 100%;
        box-sizing: border-box;
        padding: 8px;
        margin-top: 6px;
      }
      button { margin-top: 12px; padding: 10px; width: 100%; cursor: pointer; }
      small { color: #666; display:block; margin-top: 8px; line-height: 1.35; }
      .row { display:flex; gap:8px; }
      .row > div { flex:1; }
    </style>
  </head>
  <body>
    <div><strong>Google Voice → CRM</strong></div>
    <small>
      This is a minimal internal popup to test the flow. In production your CRM UI should trigger the
      extension with the number + JWT.
    </small>

    <label>Backend Base URL (example: http://localhost:3000)</label>
    <input id="backendBaseUrl" placeholder="http://localhost:3000" />

    <label>JWT (Authorization Bearer token)</label>
    <textarea id="jwt" rows="3" placeholder="paste your CRM login token here"></textarea>

    <label>
      <input type="checkbox" id="consent" />
      I have explicit consent to capture audio for transcription (audio is NOT stored)
    </label>

    <label>Phone number to dial</label>
    <input id="phoneNumber" placeholder="+13155551234" />

    <div class="row">
      <div>
        <label>leadId (optional)</label>
        <input id="leadId" placeholder="123" />
      </div>
      <div>
        <label>clientLeadId (optional)</label>
        <input id="clientLeadId" placeholder="456" />
      </div>
    </div>

    <button id="saveConfig" style="background: #28a745; color: white; margin-bottom: 8px;">Save Config</button>
    <button id="start">Open Voice & Dial</button>

    <small id="status"></small>

    <script src="popup.js"></script>
  </body>
</html>
